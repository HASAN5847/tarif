<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Okul Sayaci</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px }
  input, button { padding: 10px; font-size: 16px }
  #timer { font-size: 24px; margin-top: 20px; font-weight: bold; color: #cc0000 }
</style>
</head>
<body>

<h1>Okul Sayaci</h1>
<input type="text" id="schoolInput" placeholder="Okul adi yazin">
<button onclick="startTimer()">Okulu Ara</button>

<div id="timer"></div>

<script>
function startTimer() {
  const schoolName = document.getElementById('schoolInput').value
  if (!schoolName) return

  const now = new Date()
  const target = new Date()
  target.setDate(now.getDate() + 1)
  target.setHours(10, 0, 0, 0)

  const interval = setInterval(function() {
    const currentTime = new Date()
    const diff = target - currentTime

    if (diff <= 0) {
      clearInterval(interval)
      document.getElementById('timer').innerText = schoolName + ' icin sure doldu'
      return
    }

    const hours = Math.floor(diff / (1000 * 60 * 60))
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))
    const seconds = Math.floor((diff % (1000 * 60)) / 1000)

    document.getElementById('timer').innerText = schoolName + ' acilmasina kalan sure ' + hours + ' saat ' + minutes + ' dakika ' + seconds + ' saniye'
  }, 1000)
}
</script>

</body>
</html>
